<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperfocus Universe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050612;
      font-family: Arial, sans-serif;
      color: white;
    }

    #universe {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      perspective: 1200px;
    }

    #universe.dragging {
      cursor: grabbing;
    }

    #camera {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      transition: transform 1.6s cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
    }

    #world {
      position: absolute;
      inset: 0;
      background-image: url("universe.png");
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      transform-origin: center;
      will-change: transform;
    }

    /* Unsichtbare Klickflächen */

    .planet {
      position: absolute;
      width: 17%;
      height: 31%;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      outline: none;
      appearance: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Keine Kreise beim Darüberfahren */

    .planet:hover,
    .planet:active {
      border: none;
      background: transparent;
      box-shadow: none;
    }

    /* Fokusmarkierung nur bei Tastaturbedienung */

    .planet:focus-visible {
      outline: 2px dashed rgba(255,255,255,.85);
      outline-offset: 4px;
    }

    /* Positionen der sechs Planeten */

    #productivity {
      left: 5%;
      top: 14%;
    }

    #learning {
      left: 40%;
      top: 5%;
    }

    #creative {
      left: 75%;
      top: 14%;
    }

    #wellness {
      left: 5%;
      top: 58%;
    }

    #life {
      left: 40%;
      top: 58%;
    }

    #entertainment {
      left: 75%;
      top: 58%;
    }

    /* Bedienelemente */

    #backButton {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 20;

      display: none;
      padding: 13px 20px;

      background: rgba(12, 12, 30, .85);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 12px;

      color: white;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    #backButton:hover {
      background: rgba(40, 35, 75, .95);
    }

    #planetName {
      position: fixed;
      bottom: 35px;
      left: 50%;
      z-index: 20;

      display: none;
      transform: translateX(-50%);

      padding: 12px 22px;
      border-radius: 14px;
      background: rgba(10, 10, 30, .65);
      backdrop-filter: blur(10px);

      font-size: clamp(17px, 3vw, 25px);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      z-index: 10;

      transform: translateX(-50%);
      padding: 9px 15px;
      border-radius: 12px;

      background: rgba(10, 10, 30, .55);
      color: rgba(255,255,255,.85);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #camera {
        transition-duration: .01ms;
      }
    }
  </style>
</head>

<body>

  <div id="universe">
    <div id="camera">
      <div id="world">

        <button
          class="planet"
          id="productivity"
          data-name="Productivity Planet"
          data-x="13"
          data-y="29"
          aria-label="Productivity Planet öffnen">
        </button>

        <button
          class="planet"
          id="learning"
          data-name="Learning Planet"
          data-x="48"
          data-y="20"
          aria-label="Learning Planet öffnen">
        </button>

        <button
          class="planet"
          id="creative"
          data-name="Creative Planet"
          data-x="83"
          data-y="29"
          aria-label="Creative Planet öffnen">
        </button>

        <button
          class="planet"
          id="wellness"
          data-name="Wellness Planet"
          data-x="13"
          data-y="73"
          aria-label="Wellness Planet öffnen">
        </button>

        <button
          class="planet"
          id="life"
          data-name="Life Management Planet"
          data-x="48"
          data-y="73"
          aria-label="Life Management Planet öffnen">
        </button>

        <button
          class="planet"
          id="entertainment"
          data-name="Entertainment Planet"
          data-x="83"
          data-y="73"
          aria-label="Entertainment Planet öffnen">
        </button>

      </div>
    </div>
  </div>

  <button id="backButton" type="button">
    ← Zurück ins Universum
  </button>

  <div id="planetName" aria-live="polite"></div>

  <div id="hint">
    🖱️ Ziehen zum Bewegen · Mausrad zum Zoomen · Planeten anklicken
  </div>

  <script>
    const universe = document.getElementById("universe");
    const camera = document.getElementById("camera");
    const world = document.getElementById("world");
    const backButton = document.getElementById("backButton");
    const planetName = document.getElementById("planetName");
    const hint = document.getElementById("hint");

    const planets = document.querySelectorAll(".planet");

    let zoom = 1;
    let offsetX = 0;
    let offsetY = 0;

    let travelling = false;
    let dragging = false;
    let moved = false;

    let startX = 0;
    let startY = 0;
    let initialX = 0;
    let initialY = 0;

    let activePointer = null;
    let suppressClick = false;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    function updateCamera() {
      camera.style.transform =
        `translate3d(${offsetX}px, ${offsetY}px, 0) scale(${zoom})`;
    }

    function enableSmoothMovement() {
      camera.style.transition = reducedMotion.matches
        ? "none"
        : "transform 1.6s cubic-bezier(.22, 1, .36, 1)";
    }

    function travel(name, x, y) {
      if (travelling) return;

      travelling = true;
      dragging = false;

      enableSmoothMovement();

      const rect = universe.getBoundingClientRect();

      zoom = 2.5;

      offsetX = (50 - x) / 100 * rect.width * zoom;
      offsetY = (50 - y) / 100 * rect.height * zoom;

      world.style.transform = "none";

      updateCamera();

      planetName.textContent = name;
      planetName.style.display = "block";

      backButton.style.display = "block";
      hint.style.display = "none";
    }

    function goBack() {
      travelling = false;

      enableSmoothMovement();

      zoom = 1;
      offsetX = 0;
      offsetY = 0;

      updateCamera();

      planetName.style.display = "none";
      backButton.style.display = "none";
      hint.style.display = "block";
    }

    planets.forEach(planet => {
      planet.addEventListener("click", event => {
        if (suppressClick || moved || travelling) {
          event.preventDefault();
          return;
        }

        const name = planet.dataset.name;
        const x = Number(planet.dataset.x);
        const y = Number(planet.dataset.y);

        travel(name, x, y);
      });
    });

    backButton.addEventListener("click", goBack);

    universe.addEventListener("pointerdown", event => {
      if (travelling || event.button !== 0) return;

      activePointer = event.pointerId;
      dragging = true;
      moved = false;

      startX = event.clientX;
      startY = event.clientY;

      initialX = offsetX;
      initialY = offsetY;

      camera.style.transition = "none";
    });

    window.addEventListener("pointermove", event => {
      if (
        dragging &&
        event.pointerId === activePointer
      ) {
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;

        if (Math.hypot(dx, dy) > 6) {
          moved = true;
          suppressClick = true;
          universe.classList.add("dragging");
        }

        if (moved) {
          offsetX = initialX + dx;
          offsetY = initialY + dy;

          updateCamera();
        }

        return;
      }

      if (travelling || dragging || reducedMotion.matches) {
        return;
      }

      const rect = universe.getBoundingClientRect();

      const mouseX =
        (event.clientX - rect.left) / rect.width - 0.5;

      const mouseY =
        (event.clientY - rect.top) / rect.height - 0.5;

      const rotateY = mouseX * 2;
      const rotateX = -mouseY * 2;

      world.style.transform =
        `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
    });

    function stopDragging(event) {
      if (
        !dragging ||
        event.pointerId !== activePointer
      ) {
        return;
      }

      dragging = false;
      activePointer = null;

      universe.classList.remove("dragging");

      enableSmoothMovement();

      if (moved) {
        suppressClick = true;

        setTimeout(() => {
          suppressClick = false;
          moved = false;
        }, 100);
      }
    }

    window.addEventListener("pointerup", stopDragging);
    window.addEventListener("pointercancel", stopDragging);

    universe.addEventListener("wheel", event => {
      if (travelling) return;

      event.preventDefault();

      const change = -event.deltaY * 0.001;

      zoom = Math.max(
        1,
        Math.min(3, zoom + change)
      );

      camera.style.transition =
        "transform .2s ease-out";

      updateCamera();
    }, { passive: false });

    updateCamera();
  </script>

</body>
</html>
