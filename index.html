<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperfocus Universe 3D</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030410;
    color: white;
    font-family: Arial, sans-serif;
  }

  canvas {
    display: block;
    touch-action: none;
    cursor: grab;
  }

  canvas:active {
    cursor: grabbing;
  }

  #ui {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 10;
    pointer-events: none;
  }

  #title {
    font-size: clamp(17px, 2.5vw, 25px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 20px #8a7dff;
  }

  #subtitle {
    margin-top: 8px;
    color: #c4c2df;
    font-size: 13px;
  }

  #back {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 20;
    display: none;
    padding: 13px 20px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    background: rgba(12,12,35,0.85);
    color: white;
    cursor: pointer;
    backdrop-filter: blur(12px);
  }

  #back:hover {
    background: rgba(45,40,85,0.95);
  }

  #planetInfo {
    position: fixed;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: none;
    padding: 14px 24px;
    border-radius: 15px;
    background: rgba(12,12,35,0.8);
    backdrop-filter: blur(12px);
    text-align: center;
    font-size: clamp(17px, 2.5vw, 23px);
    white-space: nowrap;
    pointer-events: none;
  }

  #hint {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: 95%;
    text-align: center;
    color: #aaa9cb;
    font-size: 12px;
    pointer-events: none;
  }

  #error {
    position: fixed;
    inset: 20%;
    display: none;
    place-items: center;
    text-align: center;
    color: white;
    z-index: 30;
  }
</style>
</head>

<body>

<div id="ui">
  <div id="title">HYPERFOCUS UNIVERSE</div>
  <div id="subtitle">Explore your worlds</div>
</div>

<button id="back" type="button">
  ← Zurück ins Universum
</button>

<div id="planetInfo" aria-live="polite"></div>

<div id="hint">
  🖱️ Planeten anklicken · Ziehen zum Drehen · Mausrad zum Zoomen
</div>

<div id="error">
  Die 3D-Grafik konnte nicht geladen werden.
</div>

<script type="module">

import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

/* ==================================================
   GRUNDLAGEN
================================================== */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030410);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, 42);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

/* ==================================================
   LICHT
================================================== */

scene.add(
  new THREE.AmbientLight(0x9ca8ff, 1.7)
);

const sunlight = new THREE.DirectionalLight(
  0xffffff,
  3.2
);

sunlight.position.set(12, 18, 25);
scene.add(sunlight);

const blueLight = new THREE.PointLight(
  0x6688ff,
  120
);

blueLight.position.set(-15, -10, 12);
scene.add(blueLight);

/* ==================================================
   STERNE
================================================== */

const starGeometry = new THREE.BufferGeometry();
const starPositions = [];

for (let i = 0; i < 2200; i++) {
  starPositions.push(
    (Math.random() - 0.5) * 240,
    (Math.random() - 0.5) * 160,
    -25 - Math.random() * 150
  );
}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    starPositions,
    3
  )
);

const stars = new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({
    color: 0xe4eaff,
    size: 0.13,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true
  })
);

scene.add(stars);

/* ==================================================
   PLANETEN
================================================== */

const planets = [];
const planetMeshes = [];

function createPlanet(name, color, x, y, size) {

  const group = new THREE.Group();
  group.position.set(x, y, 0);

  const material = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.65,
    metalness: 0.15
  });

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(size, 64, 64),
    material
  );

  sphere.userData.planetGroup = group;
  group.add(sphere);

  const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(
      size * 1.08,
      48,
      48
    ),
    new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.09,
      depthWrite: false
    })
  );

  group.add(atmosphere);

  group.userData = {
    name,
    size,
    sphere
  };

  scene.add(group);

  planets.push(group);
  planetMeshes.push(sphere);

  return group;
}

/* ==================================================
   PRODUCTIVITY PLANET
================================================== */

const productivity = createPlanet(
  "Productivity Planet",
  0x80dfff,
  -12, 7, 3.2
);

const productivitySphere =
  productivity.userData.sphere;

productivitySphere.material.roughness = 0.35;
productivitySphere.material.metalness = 0.45;

/* Energieringe */

function createEnergyRing(
  parent,
  radius,
  color,
  tilt
) {

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(
      radius,
      0.035,
      12,
      120
    ),
    new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.8,
      depthWrite: false
    })
  );

  ring.rotation.x = tilt;
  parent.add(ring);

  return ring;
}

const productivityRing1 = createEnergyRing(
  productivity,
  4.2,
  0x8ffaff,
  1.1
);

const productivityRing2 = createEnergyRing(
  productivity,
  4.6,
  0xbbaaff,
  1.35
);

/* Futuristische Türme */

function createTower(
  parent,
  radius,
  latitude,
  longitude,
  height
) {

  const direction = new THREE.Vector3(
    Math.cos(latitude) * Math.cos(longitude),
    Math.sin(latitude),
    Math.cos(latitude) * Math.sin(longitude)
  ).normalize();

  const towerGroup = new THREE.Group();

  towerGroup.position.copy(
    direction.clone().multiplyScalar(radius)
  );

  towerGroup.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction
  );

  const tower = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.13,
      0.25,
      height,
      6
    ),
    new THREE.MeshStandardMaterial({
      color: 0xc5eeff,
      metalness: 0.75,
      roughness: 0.18,
      emissive: 0x124466,
      emissiveIntensity: 0.3
    })
  );

  tower.position.y = height / 2;
  towerGroup.add(tower);

  const crystal = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.22),
    new THREE.MeshStandardMaterial({
      color: 0xaaddff,
      emissive: 0x66ddff,
      emissiveIntensity: 1.5,
      metalness: 0.3,
      roughness: 0.15
    })
  );

  crystal.position.y = height + 0.15;
  towerGroup.add(crystal);

  parent.add(towerGroup);

  return towerGroup;
}

createTower(productivity, 3.2, 0.8, 0.2, 1.1);
createTower(productivity, 3.2, 0.6, 0.6, 1.6);
createTower(productivity, 3.2, 0.9, 1.0, 0.9);
createTower(productivity, 3.2, 0.4, 1.4, 1.3);
createTower(productivity, 3.2, 1.1, 1.8, 0.8);
createTower(productivity, 3.2, 0.7, 2.3, 1.5);
createTower(productivity, 3.2, 0.5, 2.8, 1.0);
createTower(productivity, 3.2, 1.0, 3.2, 1.2);

/* Schwebende Kristalle */

const floatingCrystals = [];

function createFloatingCrystal(
  parent,
  x,
  y,
  z,
  size
) {

  const crystal = new THREE.Mesh(
    new THREE.OctahedronGeometry(size),
    new THREE.MeshStandardMaterial({
      color: 0xc8aaff,
      emissive: 0x6644ff,
      emissiveIntensity: 0.8,
      transparent: true,
      opacity: 0.9
    })
  );

  crystal.position.set(x, y, z);
  crystal.userData.baseY = y;

  parent.add(crystal);
  floatingCrystals.push(crystal);

  return crystal;
}

createFloatingCrystal(
  productivity, 0, 4.3, 0, 0.25
);

createFloatingCrystal(
  productivity, 2.8, 2.9, 1.5, 0.18
);

createFloatingCrystal(
  productivity, -2.5, 3.1, 1.8, 0.22
);

/* ==================================================
   ANDERE FÜNF PLANETEN
================================================== */

createPlanet(
  "Learning Planet",
  0x9966ff,
  0, 10, 3.5
);

createPlanet(
  "Creative Planet",
  0xff78bb,
  12, 7, 3.1
);

createPlanet(
  "Wellness Planet",
  0x85d8aa,
  -12, -7, 3.3
);

createPlanet(
  "Life Management Planet",
  0xe4b786,
  0, -10, 3.4
);

createPlanet(
  "Entertainment Planet",
  0x5577ff,
  12, -7, 3.2
);

/* ==================================================
   KAMERA
================================================== */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const targetPosition = new THREE.Vector3(
  0, 0, 42
);

const targetLookAt = new THREE.Vector3(
  0, 0, 0
);

const currentLookAt = new THREE.Vector3(
  0, 0, 0
);

let selectedPlanet = null;
let dragging = false;
let moved = false;

let startX = 0;
let startY = 0;

const backButton =
  document.getElementById("back");

const planetInfo =
  document.getElementById("planetInfo");

/* Planetenreise */

function selectPlanet(planet) {

  selectedPlanet = planet;

  const size = planet.userData.size;

  targetPosition.set(
    planet.position.x,
    planet.position.y,
    size * 3.8
  );

  targetLookAt.copy(planet.position);

  planetInfo.textContent =
    planet.userData.name;

  planetInfo.style.display = "block";
  backButton.style.display = "block";
}

/* Zurück zur Übersicht */

function goBack() {

  selectedPlanet = null;

  targetPosition.set(0, 0, 42);
  targetLookAt.set(0, 0, 0);

  planetInfo.style.display = "none";
  backButton.style.display = "none";
}

backButton.addEventListener("click", goBack);

/* ==================================================
   MAUSSTEUERUNG
================================================== */

renderer.domElement.addEventListener(
  "pointerdown",
  event => {

    dragging = true;
    moved = false;

    startX = event.clientX;
    startY = event.clientY;
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  event => {

    if (!dragging) return;

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    if (Math.abs(dx) + Math.abs(dy) > 6) {
      moved = true;
    }
  }
);

renderer.domElement.addEventListener(
  "pointerup",
  event => {

    if (!dragging) return;

    dragging = false;

    if (moved || selectedPlanet) return;

    const rect =
      renderer.domElement.getBoundingClientRect();

    pointer.x =
      ((event.clientX - rect.left) / rect.width) * 2 - 1;

    pointer.y =
      -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);

    const intersects =
      raycaster.intersectObjects(planetMeshes);

    if (intersects.length > 0) {

      const planet =
        intersects[0].object.userData.planetGroup;

      selectPlanet(planet);
    }
  }
);

renderer.domElement.addEventListener(
  "pointercancel",
  () => {
    dragging = false;
  }
);

/* Zoom */

renderer.domElement.addEventListener(
  "wheel",
  event => {

    event.preventDefault();

    if (selectedPlanet) return;

    targetPosition.z += event.deltaY * 0.02;

    targetPosition.z = THREE.MathUtils.clamp(
      targetPosition.z,
      30,
      65
    );
  },
  { passive: false }
);

/* ==================================================
   ANIMATION
================================================== */

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(
    clock.getDelta(),
    0.05
  );

  const elapsed = clock.elapsedTime;

  const smoothing =
    1 - Math.exp(-3 * delta);

  /* Planetenrotation */

  planets.forEach(planet => {
    planet.rotation.y += delta * 0.12;
  });

  /* Bewegte Energieringe */

  productivityRing1.rotation.z +=
    delta * 0.035;

  productivityRing2.rotation.z -=
    delta * 0.025;

  /* Schwebende Kristalle */

  floatingCrystals.forEach((crystal, index) => {

    crystal.rotation.y += delta * 0.5;

    crystal.position.y =
      crystal.userData.baseY +
      Math.sin(elapsed * 0.8 + index) * 0.08;
  });

  /* Sterne */

  stars.rotation.y += delta * 0.001;

  /* Sanfte Kamerafahrt */

  camera.position.lerp(
    targetPosition,
    smoothing
  );

  currentLookAt.lerp(
    targetLookAt,
    smoothing
  );

  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
}

animate();

/* ==================================================
   RESPONSIVE DARSTELLUNG
================================================== */

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );
});

</script>
</body>
</html>
