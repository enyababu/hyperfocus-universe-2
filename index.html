<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperfocus Universe 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #030410;
  color: white;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#ui {
  position: fixed;
  top: 25px;
  left: 25px;
  z-index: 10;
  pointer-events: none;
}

#title {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 0 0 20px #8a7dff;
}

#subtitle {
  margin-top: 8px;
  color: #c4c2df;
  font-size: 13px;
}

#back {
  position: fixed;
  top: 25px;
  right: 25px;
  z-index: 20;
  display: none;
  padding: 13px 20px;
  border: 1px solid #777;
  border-radius: 12px;
  background: rgba(12, 12, 35, .85);
  color: white;
  cursor: pointer;
}

#planetInfo {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: none;
  padding: 15px 25px;
  border-radius: 15px;
  background: rgba(12, 12, 35, .8);
  text-align: center;
  font-size: 22px;
}

#hint {
  position: fixed;
  bottom: 18px;
  width: 100%;
  text-align: center;
  color: #aaa9cb;
  font-size: 12px;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="ui">
  <div id="title">HYPERFOCUS UNIVERSE</div>
  <div id="subtitle">Explore your worlds</div>
</div>

<button id="back">← Zurück ins Universum</button>

<div id="planetInfo"></div>

<div id="hint">
  🖱️ Planet anklicken · Mausrad zum Zoomen
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030410);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, 38);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* LICHT */

scene.add(new THREE.AmbientLight(0x8888bb, 2));

const light = new THREE.PointLight(0xffffff, 1000);
light.position.set(10, 15, 20);
scene.add(light);

/* STERNE */

const starGeometry = new THREE.BufferGeometry();
const starPositions = [];

for (let i = 0; i < 1800; i++) {
  starPositions.push(
    (Math.random() - 0.5) * 220,
    (Math.random() - 0.5) * 140,
    -20 - Math.random() * 120
  );
}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.12,
    transparent: true,
    opacity: 0.8
  })
);

scene.add(stars);

/* PLANETEN */

const planets = [];

function createPlanet(name, color, x, y, size) {

  const geometry = new THREE.SphereGeometry(
    size, 64, 64
  );

  const material = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.65,
    metalness: 0.15
  });

  const planet = new THREE.Mesh(geometry, material);

  planet.position.set(x, y, 0);
  planet.userData.name = name;
  planet.userData.size = size;

  scene.add(planet);
  planets.push(planet);

  /* Atmosphäre */

  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(size * 1.12, 48, 48),
    new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.10,
      depthWrite: false
    })
  );

  planet.add(glow);

  return planet;
}

createPlanet(
  "Productivity Planet",
  0x80dfff,
  -12, 7, 3.2
);

createPlanet(
  "Learning Planet",
  0x9966ff,
  0, 10, 3.5
);

createPlanet(
  "Creative Planet",
  0xff78bb,
  12, 7, 3.1
);

createPlanet(
  "Wellness Planet",
  0x85d8aa,
  -12, -7, 3.3
);

createPlanet(
  "Life Management Planet",
  0xe4b786,
  0, -10, 3.4
);

createPlanet(
  "Entertainment Planet",
  0x5577ff,
  12, -7, 3.2
);

/* KAMERASTEUERUNG */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const targetPosition = new THREE.Vector3(0, 0, 38);
const targetLookAt = new THREE.Vector3(0, 0, 0);
const currentLookAt = new THREE.Vector3(0, 0, 0);

let selectedPlanet = null;

const backButton = document.getElementById("back");
const planetInfo = document.getElementById("planetInfo");

function selectPlanet(planet) {

  selectedPlanet = planet;

  const size = planet.userData.size;

  targetPosition.set(
    planet.position.x,
    planet.position.y,
    size * 3.4
  );

  targetLookAt.copy(planet.position);

  planetInfo.textContent = planet.userData.name;
  planetInfo.style.display = "block";
  backButton.style.display = "block";
}

function goBack() {

  selectedPlanet = null;

  targetPosition.set(0, 0, 38);
  targetLookAt.set(0, 0, 0);

  planetInfo.style.display = "none";
  backButton.style.display = "none";
}

backButton.addEventListener("click", goBack);

/* PLANETEN ANKLICKEN */

renderer.domElement.addEventListener("click", event => {

  if (selectedPlanet) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(planets);

  if (intersects.length > 0) {
    selectPlanet(intersects[0].object);
  }
});

/* ZOOM */

renderer.domElement.addEventListener("wheel", event => {

  event.preventDefault();

  if (selectedPlanet) return;

  targetPosition.z += event.deltaY * 0.02;

  targetPosition.z = THREE.MathUtils.clamp(
    targetPosition.z,
    25,
    65
  );

}, { passive: false });

/* ANIMATION */

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  const smoothing = 1 - Math.exp(-3 * delta);

  planets.forEach(planet => {
    planet.rotation.y += delta * 0.12;
  });

  stars.rotation.y += delta * 0.001;

  camera.position.lerp(targetPosition, smoothing);

  currentLookAt.lerp(targetLookAt, smoothing);
  camera.lookAt(currentLookAt);

  renderer.render(scene, camera);
}

animate();

/* FENSTERGRÖSSE */

window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>
</body>
</html>
